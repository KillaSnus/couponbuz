# Cloudflare Pages project configuration for CouponBuz.
# Run `npm run setup` once: it creates the KV storage and puts its id below.
name = "couponbuz"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# CMS storage. Content, settings, submissions and uploaded images live here.
[[kv_namespaces]]
binding = "CMS"
id = "REPLACE_WITH_KV_ID"

[vars]
# Your real domain, no trailing slash. Used for canonical URLs and the sitemap.
SITE_URL = "https://couponbuz.pro"
# "true" shows the clearly-labelled sample offers when the CMS is empty. Set to "false" once you add real offers.
SHOW_DEMO = "true"

# SECRETS (never put these in this file). Set them with:
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name couponbuz
#   ADMIN_EMAIL        optional: only this email can sign in
#   SESSION_SECRET     optional: long random text used to sign login tokens
#   ANTHROPIC_API_KEY  optional: turns on the AI answers in the chat bubble
